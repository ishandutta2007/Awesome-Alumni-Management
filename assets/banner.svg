<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 260"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e17"/><stop offset="50%" stop-color="#121829"/><stop offset="100%" stop-color="#1a102f"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#38bdf8;#818cf8;#c084fc;#38bdf8"/></stop><stop offset="100%" stop-color="#818cf8"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#818cf8;#c084fc;#38bdf8;#818cf8"/></stop></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#e0e7ff"/></linearGradient><radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#60a5fa" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".7" stdDeviation="6"/></filter><filter id="glow"><feGaussianBlur result="coloredBlur" stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(.98)}50%{opacity:.8;transform:scale(1.02)}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.grid-line{stroke:#1e293b;stroke-width:1;stroke-opacity:.4}.network-line{stroke:#38bdf8;stroke-width:1.5;stroke-opacity:.35;stroke-dasharray:6 4;animation:dash 20s linear infinite}.floating-node-1{animation:floatNode 5s ease-in-out infinite}.floating-node-2{animation:floatNode 7s ease-in-out infinite 1s}.floating-node-3{animation:floatNode 6s ease-in-out infinite 2s}.title-text{font-weight:800;font-size:42px;fill:url(#textGrad);filter:url(