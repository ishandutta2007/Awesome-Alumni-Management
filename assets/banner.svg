<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a102f" />
    </linearGradient>

    <!-- Dynamic Animated Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Radial Glow for Nodes -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows for Crisp Visibility -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes floatNode {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.4; }
    .network-line { stroke: #38bdf8; stroke-width: 1.5; stroke-opacity: 0.35; stroke-dasharray: 6 4; animation: dash 20s linear infinite; }
    .floating-node-1 { animation: floatNode 5s ease-in-out infinite; }
    .floating-node-2 { animation: floatNode 7s ease-in-out infinite 1s; }
    .floating-node-3 { animation: floatNode 6s ease-in-out infinite 2s; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); filter: url(#shadow); }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; filter: url(#shadow); letter-spacing: 0.5px; }
    .badge-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
  </style>

  <!-- Background Card -->
  <rect width="900" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="896" height="256" x="2" y="2" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Grid Background Lines -->
  <g class="grid-layer">
    <line x1="0" y1="65" x2="900" y2="65" class="grid-line" />
    <line x1="0" y1="130" x2="900" y2="130" class="grid-line" />
    <line x1="0" y1="195" x2="900" y2="195" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="260" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="260" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="260" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="260" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="260" class="grid-line" />
  </g>

  <!-- Dynamic Network Lines & Animated Nodes (Background Layer - behind text) -->
  <g class="network-layer">
    <!-- Network Connections -->
    <path d="M 650 60 L 760 110 L 830 70 L 780 190 L 670 170 Z" class="network-line" />
    <line x1="760" y1="110" x2="670" y2="170" class="network-line" />
    <line x1="650" y1="60" x2="780" y2="190" class="network-line" />
    <line x1="100" y1="190" x2="180" y2="130" class="network-line" />

    <!-- Glow Backings -->
    <circle cx="760" cy="110" r="30" fill="url(#nodeGlow)" />
    <circle cx="650" cy="60" r="25" fill="url(#nodeGlow)" />
    <circle cx="830" cy="70" r="25" fill="url(#nodeGlow)" />

    <!-- Animated Nodes -->
    <g class="floating-node-1">
      <circle cx="760" cy="110" r="7" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="760" cy="110" r="3" fill="#ffffff" />
    </g>
    <g class="floating-node-2">
      <circle cx="650" cy="60" r="5" fill="#818cf8" filter="url(#glow)" />
      <circle cx="830" cy="70" r="6" fill="#c084fc" filter="url(#glow)" />
    </g>
    <g class="floating-node-3">
      <circle cx="780" cy="190" r="6" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="670" cy="170" r="5" fill="#818cf8" filter="url(#glow)" />
    </g>
  </g>

  <!-- Foreground Content Layer (Guaranteed overlay on top of dynamic elements) -->
  <g transform="translate(50, 0)">
    <!-- Category Tag -->
    <g transform="translate(0, 62)">
      <rect x="0" y="-14" width="220" height="24" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="12" y="2" class="badge-tag">🎓 HIGHER-ED TECH &amp; CRM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" class="title-text">Awesome Alumni Management</text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle-text">Curated SaaS Platforms, Open-Source CRMs &amp; Engagement Ecosystems</text>

    <!-- Decorative Accent Bar -->
    <rect x="0" y="190" width="360" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>
